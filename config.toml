# Application configuration for the earnings-transcript-analysis POC.
#
# Only genuinely tunable knobs live here. Secrets live in .env (never here); env-var
# NAMES, endpoint URLs and the output-directory layout stay in config.py because
# changing them would break the repo-scoped skills, not just tune behaviour.
#
# config.py loads this file at import via stdlib tomllib and falls back to built-in
# defaults for any key that is absent, so deleting this file is harmless.

[http]
timeout_seconds = 20.0
max_fetch_mb = 10            # hard cap on any single fetched resource

[segmentation]
# Exact, case-insensitive structural headings. These may be omitted from segment
# text, but every omission is recorded in segmentation-report.json.
qa_standalone_headings = [
    "q&a",
    "questions and answers",
    "question and answer session",
    "question-and-answer session",
]
# Narrow phrases which mark the first prepared -> Q&A transition. A matching
# sentence is preserved under its speaker before the section changes.
qa_transition_phrases = [
    "go to q&a",
    "move over to q&a",
    "open the line for q&a",
    "q&a session commences",
    "begin the question-and-answer session",
]

[sanitisation]
# Best-effort prompt-injection FLAG (not a classifier, not a gate). After the
# transcript is sanitised (invisible/zero-width chars already stripped), each pattern
# below is matched case-insensitively; any hit is recorded in manifest.json and a
# per-run injection-scan.json -- the run is never blocked and nothing is removed
# (suspicious text stays quotable data). Applies to the fetched/loaded TRANSCRIPT only,
# not Exa/Tavily results (those providers run their own defences). Set enabled = false
# if it becomes noisy. Patterns are anchored to avoid ordinary prose (e.g. "ignore
# macro headwinds" must not trip "ignore ... instructions"). Extend the list freely.
injection_scan_enabled = true
injection_patterns = [
    "ignore (all |the |any |your )*(previous|prior|above|preceding|earlier) (instructions|prompts|context|messages)",
    "disregard (all |the |any |your )*(previous|prior|above|preceding|earlier)",
    "forget (all |everything |the )*(previous|prior|above|earlier|you were told)",
    "override (all |the |your )*(previous|prior|above|system) (instructions|prompt|rules)",
    "new instructions?:",
    "updated instructions?:",
    "system prompt",
    "reveal (your |the )*(system )?(prompt|instructions)",
    "print (your |the )*(system )?(prompt|instructions)",
    "repeat (your |the )*(system )?(prompt|instructions)",
    "you are now (in )?(developer|dev|debug|admin|god|dan) mode",
    "developer mode enabled",
    "enable (developer|dev|debug|jailbreak) mode",
    "jailbreak",
    "do anything now",
    "\\bdan\\b prompt",
    "act as (an? )?(unrestricted|uncensored|unfiltered)",
    "pretend (you are|to be) (an? )?(unrestricted|different|jailbroken)",
    "you must (now )?(obey|comply|follow) ",
    "from now on,? you",
    "bypass (your |the )*(safety|content|security) (filter|policy|guidelines|guardrails)",
    "ignore (your |the )*(safety|content|security) (filter|policy|guidelines|guardrails)",
    "\\b(system|assistant|user)\\s*:\\s*you",
    "<\\|?(system|im_start|endoftext)\\|?>",
    "end of (transcript|document)\\.? (now|then) (ignore|disregard|follow)",
]

[pdf_ingestion]
# PDF-syndicated transcripts sometimes use a FactSet CallStreet-style layout: speaker
# Name and Title on separate lines, separated by a dotted rule between turns, instead
# of the "Name — Title:" single-line header segmentation expects. When enabled, the
# separator pattern below (matched >=2 times) auto-detects that ONE confirmed vendor
# layout and rewrites it; banner_patterns strip page-number/footer lines during the
# rewrite. Any other vendor's PDF layout is NOT auto-handled -- see
# docs/AUDITABILITY.md "Known limitations".
factset_reformat_enabled = true
factset_separator_pattern = '^[.]{10,}\s*$'
factset_banner_patterns = [
    '^FINAL TRANSCRIPT\s*$',
    '^Copyright ©.*$',
    '^\d{1,4}\s*$',
]

[validation]
calc_relative_tolerance = 0.01     # 1% relative tolerance for recomputed derived metrics
calc_absolute_tolerance = 0.005
numeric_match_tolerance = 1e-6     # how close a claimed number must be to a source number

[review]
max_review_rounds = 3               # 1 full review + up to N-1 diff-based re-reviews; the (max_review_rounds+1)th attempt is refused outright
diff_review_max_claims_changed = 3  # more than this many added/changed/removed claims forces a full review instead of a diff review
diff_review_conclusion_sections = [1, 5, 6, 7]  # outlook-brief.md section numbers (Outlook in brief, Base/Upside/Downside case) -- any citing a changed claim forces a full review

[sec]
# us-gaap XBRL concepts pulled from SEC company-facts when a CIK is available.
concepts = ["Revenues", "RevenueFromContractWithCustomerExcludingAssessedTax", "NetIncomeLoss", "EarningsPerShareDiluted"]
# Fallback User-Agent if SEC_USER_AGENT is unset in the environment. SEC requires a
# real identifying UA ("Name email"); set the real one in .env, not here.
default_user_agent = "earnings-poc unset@example.com"
resolve_cik_from_ticker = true   # auto-resolve --ticker -> CIK via SEC's ticker map if --sec-cik not given
require_period_match = true      # a fact whose XBRL "end" doesn't match --sec-period-end is dropped, not guessed
forms = ["8-K", "10-Q", "10-K", "20-F", "6-K"]  # informational: filing types this POC expects, not yet enforced

[research]
sec_enabled = true
web_search_enabled = true
provider = "exa"                  # "exa" | "tavily" -- which provider cmd_prepare calls
official_sources_only = false  # not actually enforced as a domain filter yet -- see README known limitations
archive_all_sources = true
include_previous_period = true
# Web search is repurposed toward info NOT already in the transcript: analyst
# consensus/expectations and peer-group results (the "surprise" = actual vs consensus,
# and the competitive backdrop, are absent from the call by construction). Placeholders
# {company} {ticker} {event_id} fill per run; peer_queries also fill {peer} (peers come
# from the --peers CLI flag, kept out of config because peers are per-company). Empty a
# list to disable that class. These replace the old official-document queries, which
# merely restated the call -- keeping per-run search spend flat.
# Query counts are deliberately generous relative to the extraction cap below: search
# hits are cheap candidate generation, and several will turn out post-event, undated-
# and-unusable, or duplicate. More query formulations increase retrieval DIVERSITY
# (not just a bigger sample of the same ranking), so the pool surviving date/dedup/
# temporal screening stays adequate even after attrition. The retrieval boundary
# (what gets searched/archived) is deliberately wider than the evidence boundary
# (what's extracted) and the analytical boundary (what a claim actually cites) --
# widening this list does not by itself make more material to the LLM, only more
# candidates for the deterministic filters above to screen before extraction.
consensus_queries = [
    "{company} {ticker} {event_id} analyst consensus estimate revenue EPS",
    "{company} {ticker} {event_id} earnings preview expectations forecast",
    "{company} {ticker} Wall Street consensus estimates ahead of earnings",
    "{company} {ticker} {event_id} earnings guidance outlook estimates",
    "{company} {ticker} {event_id} analyst earnings reaction results",
]
peer_queries = [
    "{peer} {event_id} earnings results revenue growth",
    "{peer} quarterly results versus {company} {ticker}",
    "{peer} {event_id} earnings guidance outlook",
    "{peer} {event_id} analyst earnings reaction results",
    "{peer} earnings call key trends {event_id}",
]
# Peer-group DISCOVERY (run via `earnings discover-peers` BEFORE prepare): find the
# company's analyst-recognised comparables so the agent can pick ~4 to pass as --peers.
# The transcript usually names no competitors, so the peer group must be searched, not
# read off the call. Not event-relative (a company's peers don't change by quarter), so
# no date cutoff is applied. {company} {ticker} fill per run.
peer_group_queries = [
    "{company} {ticker} peer group comparable companies",
    "{company} {ticker} closest competitors comparable stocks analysts",
    "stocks most similar to {ticker} {company}",
]

[tavily]
search_depth = "basic"
max_results = 8                   # search hits per query -- cheap candidates, filtered well before extraction
include_external_commentary = false
include_answer = false            # no generated-answer synthesis -- primary sources only
include_raw_content = false       # full content comes from the separate extract step, not search
extract_depth = "basic"
# 15, not 10: with more query templates above, a flat 10 would waste the added
# retrieval diversity on the same handful of extraction slots. 15 archived candidates,
# after undated/post-event/duplicate attrition, typically yields ~8-10 genuinely
# usable sources -- extraction stays selective, retrieval just isn't starved.
max_extracted_sources = 15        # cap across all queries combined, selected by Tavily's own score

[exa]
type = "auto"                     # Exa /search "type": auto | neural | keyword -- "auto" never
                                   # returns a relevance "score" (live-confirmed); "neural" does.
                                   # See sources._normalize_hits for what this means downstream.
num_results = 8                   # search hits per query -- cheap candidates, filtered well before extraction
max_extracted_sources = 15        # cap across all queries combined; selected by score when the
                                   # provider gives one, otherwise by the provider's own result order
