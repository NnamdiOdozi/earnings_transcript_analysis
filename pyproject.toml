[project]
name = "earnings-transcript-analysis"
version = "0.1.0"
description = "Auditable POC pipeline: earnings-call transcript -> validated, quote-anchored signal card."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
earnings = "earnings.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/earnings"]

[tool.pytest.ini_options]
testpaths = ["tests"]
